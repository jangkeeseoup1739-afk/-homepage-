<!-- ===================================================================
     명결(命結) 사주 위젯 — 아임웹 삽입 코드
     아임웹 편집 화면 → 위젯 추가 → "HTML" (코드 입력) → 아래를 붙여넣기
     YOUR-PROJECT 부분만 실제 Vercel 주소로 바꾸면 됩니다.
     =================================================================== -->

<div id="myeonggyeol-app"></div>
<script src="https://YOUR-PROJECT.vercel.app/myeonggyeol.js"></script>


<!-- ===================================================================
     참고 1. <div>를 생략하고 <script> 한 줄만 넣어도 됩니다.
             스크립트 태그 자리에 위젯이 자동으로 생성됩니다.

     참고 2. AI 서버를 다른 주소에 두었다면 스크립트보다 "먼저" 지정하세요.
             (같은 Vercel 배포에서 불러오는 경우에는 필요 없습니다.)

       <script>window.MYEONGGYEOL_API_BASE = 'https://your-api.vercel.app';</script>
       <script src="https://YOUR-PROJECT.vercel.app/myeonggyeol.js"></script>

     참고 3. 코드 삽입이 막혀 있는 요금제라면 iframe 방식을 쓰세요.

       <iframe src="https://YOUR-PROJECT.vercel.app"
               style="width:100%;height:1400px;border:0;display:block"
               title="명결 사주" loading="lazy"></iframe>
     =================================================================== -->
