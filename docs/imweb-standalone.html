<!-- ======================================================================
     명결(命結) 전통 AI 사주 위젯 — 아임웹 "붙여넣기 전용" 단일 코드
     ----------------------------------------------------------------------
     사용법
       1) 아임웹 편집화면 → 위젯 추가 → HTML(코드 입력)
       2) 이 파일 내용을 전부 복사해서 붙여넣기 → 저장
       끝입니다. 빌드도, 서버도, 외부 파일도 필요 없습니다.

     이 코드가 아임웹에서 오류를 내지 않는 이유
       · Shadow DOM 안에서 그려지므로 아임웹 테마 CSS와 서로 침범하지 않습니다.
       · 외부 스크립트/CSS/이미지를 하나도 불러오지 않습니다(폰트만 선택적).
         히어로 배경 사진도 코드 안에 담겨 있어 따로 올릴 필요가 없습니다.
       · 만세력 계산이 100% 브라우저 안에서 끝나므로 서버가 없어도 동작합니다.
       · AI 서버에 연결하지 못해도 내장 해설로 자동 대체되어 화면이 비지 않습니다.

     (선택) AI 서버를 따로 배포했다면 이 코드 "위"에 한 줄만 추가하세요.
       <script>window.MYEONGGYEOL_API_BASE = 'https://내프로젝트.vercel.app';<\/script>
     (선택) 히어로 배경을 직접 올린 사진으로 바꾸려면
       <script>window.MYEONGGYEOL_HERO_IMAGE = 'https://내사이트.com/hero.jpg';<\/script>
     ====================================================================== -->

<div id="myeonggyeol-widget"></div>

<script>
(function () {
  'use strict';

  // ── 중복 삽입 방지 ─────────────────────────────────────────────────────
  // 아임웹에서 같은 위젯을 두 번 넣거나 페이지가 부분 갱신될 때,
  // 같은 컨테이너에 두 번 그리지 않도록 표시를 남깁니다.
  var MOUNT_FLAG = 'data-myeonggyeol-mounted';
  var CONTAINER_ID = 'myeonggyeol-widget';

  // 이 스크립트를 담고 있는 <script> 태그. 컨테이너 <div>가 없을 때
  // 스크립트 자리에 위젯을 만들기 위해 지금(동기 실행 중) 붙잡아 둡니다.
  var thisScript = document.currentScript;

  // ── 유틸 ──────────────────────────────────────────────────────────────
  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function pad2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  // ── 한국 음력 → 양력 변환 ──────────────────────────────────────────────
  //
  // 음력은 천문 관측(삭)으로 정해져 수식으로 계산할 수 없고, 한국천문연구원
  // (KASI)이 확정한 값을 표로 들고 있어야 합니다. 아래 표는 KASI 자료에서
  // 뽑은 뒤 1912~2049년의 음력 초하루 1,718개가 모두 한국 표준시(UTC+9)
  // 기준 삭(new moon)이 든 날과 맞는지 천문 계산으로 교차 검증했습니다.
  //
  // 한국 음력은 중국 음력과 다릅니다. 삭의 시각을 각자의 표준시로 판정하기
  // 때문이며, 예컨대 1988년 설날은 한국 2월 18일, 중국 2월 17일입니다.
  // 이 표는 한국 기준입니다.
  //
  // 표 형식: 한 해당 16진수 5자리.
  //   값 >> 13     = 윤달이 든 月 (0이면 윤달 없음)
  //   값 & 0x1FFF  = 그 해 각 달의 크기. 달 순서대로 1이면 30일, 0이면 29일.
  //                  윤달은 같은 달 바로 뒤에 들어갑니다.
  var LUNAR_TABLE =
    '116d20075200ea50b64a0064b00a9b095560056a00b5905752' + // 1900-1909
    '007520db2500b2500a4b0b29b00aad0056a04b6900ba90fb52' + // 1910-1919
    '00d9200d250ba4d00956002b5095ad006d400da905d9200e92' + // 1920-1929
    '0cd260052700a570b2b600ada006d406ea9007490f69300a93' + // 1930-1939
    '0052b0ca5b0096d00b6a09b5400ba400b4905a9300a950f52b' + // 1940-1949
    '0052d00aad0b56a00db200da407d4900d4a11a9500a9600556' + // 1950-1959
    '0cab500ad5006d208ea500ea500e4a06c9600a9b0f5560056a' + // 1960-1969
    '00b590b75200752007250964b00a4b112ab002ad0056b0cb69' + // 1970-1979
    '00da900d9209b2500d2515a4d00a56002b60d5ad006d400da9' + // 1980-1989
    '0bd9200e9200d2606a5600a57112b600b5a006d40aec900749' + // 1990-1999
    '00693095270052b00a5b0555a0036a0fb5500ba400b490ba93' + // 2000-2009
    '00a950052d06a5d00aad135aa005d200da50bd4a00d4a00a95' + // 2010-2019
    '0952d0055600ab5055aa006d20cea500ea500e4a0ac9600c9b' + // 2020-2029
    '0055a06ad500b69177520075200b250d64b00a4b004ab0a55b' + // 2030-2039
    '0056d00b6905b5200d920fd2500d2500a4d0b4ad002b6005b5'; // 2040-2049

  var LUNAR_MIN_YEAR = 1900;
  var LUNAR_MAX_YEAR = 2049;
  var LUNAR_BASE_UTC = Date.UTC(1900, 0, 31); // 음력 1900년 1월 1일 = 양력 1900-01-31
  var LUNAR_DAY_MS = 86400000;

  function lunarYearSupported(year) {
    return year >= LUNAR_MIN_YEAR && year <= LUNAR_MAX_YEAR;
  }

  function lunarYearValue(year) {
    var at = (year - LUNAR_MIN_YEAR) * 5;
    return parseInt(LUNAR_TABLE.slice(at, at + 5), 16);
  }

  /** 그 해에 든 윤달의 月. 윤달이 없으면 0. */
  function lunarLeapMonth(year) {
    if (!lunarYearSupported(year)) return 0;
    return lunarYearValue(year) >> 13;
  }

  /** 그 해 달 순서에서 해당 달이 몇 번째인지. 없는 달이면 -1. */
  function lunarMonthIndex(year, month, isLeap) {
    if (!lunarYearSupported(year) || month < 1 || month > 12) return -1;
    var leap = lunarLeapMonth(year);
    if (isLeap) return leap === month ? month : -1;
    return month - 1 + (leap > 0 && month > leap ? 1 : 0);
  }

  function lunarDaysAtIndex(year, index) {
    return (lunarYearValue(year) & 0x1fff) & (1 << index) ? 30 : 29;
  }

  /** 음력 한 달의 일수(29 또는 30). 없는 달이면 0. */
  function lunarMonthDays(year, month, isLeap) {
    var index = lunarMonthIndex(year, month, isLeap);
    return index < 0 ? 0 : lunarDaysAtIndex(year, index);
  }

  var lunarCumulative = null;
  function lunarDaysBeforeYear(year) {
    if (!lunarCumulative) {
      lunarCumulative = [0];
      for (var y = LUNAR_MIN_YEAR; y < LUNAR_MAX_YEAR; y++) {
        var total = 0;
        var count = lunarLeapMonth(y) ? 13 : 12;
        for (var i = 0; i < count; i++) total += lunarDaysAtIndex(y, i);
        lunarCumulative.push(lunarCumulative[lunarCumulative.length - 1] + total);
      }
    }
    return lunarCumulative[year - LUNAR_MIN_YEAR];
  }

  /**
   * 음력 날짜를 양력으로 바꿉니다. 표에 없는 해이거나 실제로 없는 날짜면
   * null 을 돌려줍니다.
   */
  function lunarToSolar(year, month, day, isLeap) {
    var index = lunarMonthIndex(year, month, isLeap);
    if (index < 0) return null;
    if (!(day >= 1 && day <= lunarDaysAtIndex(year, index))) return null;

    var offset = lunarDaysBeforeYear(year) + (day - 1);
    for (var i = 0; i < index; i++) offset += lunarDaysAtIndex(year, i);

    var date = new Date(LUNAR_BASE_UTC + offset * LUNAR_DAY_MS);
    return { year: date.getUTCFullYear(), month: date.getUTCMonth() + 1, day: date.getUTCDate() };
  }

  // ── 만세력 상수 (src/utils/manseEngine.ts 와 동일) ─────────────────────
  var STEMS = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
  var STEMS_KR = ['갑', '을', '병', '정', '무', '기', '경', '신', '임', '계'];
  var BRANCHES = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
  var BRANCHES_KR = ['자', '축', '인', '묘', '진', '사', '오', '미', '신', '유', '술', '해'];

  var STEM_ELEMENTS = {
    '甲': 'wood', '乙': 'wood',
    '丙': 'fire', '丁': 'fire',
    '戊': 'earth', '己': 'earth',
    '庚': 'metal', '辛': 'metal',
    '壬': 'water', '癸': 'water'
  };

  var BRANCH_ELEMENTS = {
    '寅': 'wood', '卯': 'wood',
    '巳': 'fire', '午': 'fire',
    '辰': 'earth', '戌': 'earth', '丑': 'earth', '未': 'earth',
    '申': 'metal', '酉': 'metal',
    '亥': 'water', '子': 'water'
  };

  var ELEMENT_KEYS = ['wood', 'fire', 'earth', 'metal', 'water'];

  var ELEMENT_NAMES_KR = {
    wood: '목(木)',
    fire: '화(火)',
    earth: '토(土)',
    metal: '금(金)',
    water: '수(水)'
  };

  var HIDDEN_STEMS = {
    '子': ['임(壬)', '계(癸)'],
    '丑': ['계(癸)', '신(辛)', '기(己)'],
    '寅': ['무(戊)', '병(丙)', '갑(甲)'],
    '卯': ['갑(甲)', '을(乙)'],
    '辰': ['을(乙)', '계(癸)', '무(戊)'],
    '巳': ['무(戊)', '경(庚)', '병(丙)'],
    '午': ['병(丙)', '기(己)', '정(丁)'],
    '未': ['정(丁)', '을(乙)', '기(己)'],
    '申': ['무(戊)', '임(壬)', '경(庚)'],
    '酉': ['경(庚)', '신(辛)'],
    '戌': ['신(辛)', '정(丁)', '무(戊)'],
    '亥': ['무(戊)', '갑(甲)', '임(壬)']
  };

  var DAY_MASTER_DESC = {
    '갑': '큰 나무(대들보)와 같은 꿋꿋한 추진력과 진취적 리더십',
    '을': '유연한 초목처럼 뛰어난 적응력과 외유내강의 생명력',
    '병': '태양처럼 만물을 밝히는 열정과 당당한 사교성',
    '정': '촛불이나 등대처럼 은은한 온기와 섬세한 통찰력',
    '무': '웅장한 산처럼 묵직한 신뢰감과 포용력을 지닌 기상',
    '기': '비옥한 대지처럼 품어주고 조율하는 현실적 수완',
    '경': '단단한 쇠나 바위처럼 결단력 있고 의리 있는 기개',
    '신': '보석처럼 정교하고 품격 높은 예술적 감각과 자존감',
    '임': '도도한 큰 바다처럼 깊은 지혜와 광활한 포용력',
    '계': '스며드는 이슬비처럼 총명하고 부드러운 직관력'
  };

  // ── 만세력 계산 (원본 TypeScript 엔진을 그대로 옮긴 것) ────────────────
  function calculateTenGod(dayStemIdx, targetStemIdx) {
    if (targetStemIdx < 0) return '일간(본원)';
    var dayElem = STEM_ELEMENTS[STEMS[dayStemIdx]];
    var targetElem = STEM_ELEMENTS[STEMS[targetStemIdx]];
    var isSamePolarity = (dayStemIdx % 2) === (targetStemIdx % 2);

    var dayIdx = ELEMENT_KEYS.indexOf(dayElem);
    var targetIdx = ELEMENT_KEYS.indexOf(targetElem);
    var diff = (targetIdx - dayIdx + 5) % 5;

    if (diff === 0) return isSamePolarity ? '비견(比肩)' : '겁재(劫財)';
    if (diff === 1) return isSamePolarity ? '식신(食神)' : '상관(傷官)';
    if (diff === 2) return isSamePolarity ? '편재(偏財)' : '정재(正財)';
    if (diff === 3) return isSamePolarity ? '편관(偏官)' : '정관(正官)';
    return isSamePolarity ? '편인(偏印)' : '정인(正印)';
  }

  function calculateTwelveState(dayStemIdx, branchIdx) {
    var states = ['장생', '목욕', '관대', '건록', '제왕', '쇠', '병', '사', '묘', '절', '태', '양'];
    var isYang = dayStemIdx % 2 === 0;
    // 각 천간의 장생지
    var birthBranches = { 0: 11, 1: 6, 2: 2, 3: 9, 4: 2, 5: 9, 6: 8, 7: 0, 8: 8, 9: 3 };
    var startBranch = birthBranches[dayStemIdx];
    if (startBranch === undefined) startBranch = 0;

    var offset = isYang
      ? (branchIdx - startBranch + 12) % 12
      : (startBranch - branchIdx + 12) % 12;
    return states[offset] || '건록';
  }

  // 율리우스일수 기반 일주 계산
  function getDayPillarIndices(year, month, day) {
    var y = year;
    var m = month;
    if (m <= 2) {
      y -= 1;
      m += 12;
    }
    var A = Math.floor(y / 100);
    var B = 2 - A + Math.floor(A / 4);
    var JD = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + day + B - 1524.5;

    var cycle60 = Math.floor(JD + 0.5 + 49) % 60;
    return {
      stemIdx: ((cycle60 % 10) + 10) % 10,
      branchIdx: ((cycle60 % 12) + 12) % 12
    };
  }

  // 24절기 근사 기준 월주 계산
  function getMonthPillarIndices(year, month, day, yearStemIdx) {
    var solarTermDays = [6, 4, 6, 5, 6, 6, 7, 8, 8, 8, 7, 7];
    var termDay = solarTermDays[month - 1];

    var sajuMonth;
    var adjustedYearStemIdx = yearStemIdx;

    if (month === 1) {
      sajuMonth = day < termDay ? 11 : 12;
    } else if (month === 2) {
      sajuMonth = day < termDay ? 12 : 1;
    } else {
      sajuMonth = day < termDay ? month - 2 : month - 1;
    }

    // 입춘 전이면 년주도 전년도로 계산
    if (month === 1 || (month === 2 && day < termDay)) {
      adjustedYearStemIdx = (yearStemIdx - 1 + 10) % 10;
    }

    var branchIdx = (sajuMonth + 1) % 12;
    var startStem = (adjustedYearStemIdx % 5) * 2 + 2;
    var monthOffset = (sajuMonth - 1 + 12) % 12;
    var stemIdx = (startStem + monthOffset) % 10;

    return { stemIdx: stemIdx, branchIdx: branchIdx, adjustedYearStemIdx: adjustedYearStemIdx };
  }

  // 시주 계산 (지역별 진태양시 보정 포함)
  function getHourPillarIndices(dayStemIdx, hour, minute, region) {
    var totalMinutes = hour * 60 + minute;
    if (region.indexOf('서울') >= 0 || region.indexOf('경기') >= 0 || region.indexOf('인천') >= 0) {
      totalMinutes -= 32;
    } else if (region.indexOf('부산') >= 0 || region.indexOf('울산') >= 0 || region.indexOf('경상') >= 0) {
      totalMinutes -= 24;
    } else {
      totalMinutes -= 30;
    }

    if (totalMinutes < 0) totalMinutes += 24 * 60;
    totalMinutes = totalMinutes % (24 * 60);

    var branchIdx = Math.floor(((totalMinutes + 30) % (24 * 60)) / 120);
    var startStem = (dayStemIdx % 5) * 2;
    var stemIdx = (startStem + branchIdx) % 10;

    return { stemIdx: stemIdx, branchIdx: branchIdx };
  }

  function calculateManse(input) {
    var year = input.year;
    var month = input.month;
    var day = input.day;
    var lunarDate;

    // 사주는 전부 양력(절기) 기준으로 계산합니다. 음력으로 입력받았으면
    // 먼저 양력으로 환산해야 하며, 환산하지 않고 그대로 계산하면 사주
    // 네 기둥이 통째로 틀립니다.
    if (input.calendarType === 'lunar') {
      var converted = lunarToSolar(year, month, day, !!input.isLeapMonth);
      if (converted) {
        lunarDate = '음력 ' + year + '년 ' + (input.isLeapMonth ? '윤' : '') + month + '월 ' + day + '일';
        year = converted.year;
        month = converted.month;
        day = converted.day;
      }
      // 환산할 수 없는 날짜면 입력값을 양력으로 보고 계산합니다.
      // 폼에서 미리 걸러지므로 실제로는 닿지 않는 갈래입니다.
    }

    // 1. 년주
    var baseYearDiff = year - 1984;
    var yearStemIdx = ((baseYearDiff % 10) + 10) % 10;
    var yearBranchIdx = ((baseYearDiff % 12) + 12) % 12;

    // 2. 월주 및 입춘 전후 년주 보정
    var monthInfo = getMonthPillarIndices(year, month, day, yearStemIdx);
    if (monthInfo.adjustedYearStemIdx !== yearStemIdx) {
      yearStemIdx = monthInfo.adjustedYearStemIdx;
      yearBranchIdx = (yearBranchIdx - 1 + 12) % 12;
    }

    // 3. 일주
    var dayInfo = getDayPillarIndices(year, month, day);
    var dayStemIdx = dayInfo.stemIdx;
    var dayBranchIdx = dayInfo.branchIdx;

    // 4. 시주
    var hourStemIdx = -1;
    var hourBranchIdx = -1;
    if (!input.isTimeUnknown) {
      var hourInfo = getHourPillarIndices(dayStemIdx, input.hour, input.minute, input.region);
      hourStemIdx = hourInfo.stemIdx;
      hourBranchIdx = hourInfo.branchIdx;
    }

    function makePillar(stemI, branchI) {
      var s = STEMS[stemI];
      var b = BRANCHES[branchI];
      return {
        heavenlyStem: s,
        heavenlyStemKr: STEMS_KR[stemI],
        heavenlyStemElement: STEM_ELEMENTS[s],
        heavenlyStemTenGod: calculateTenGod(dayStemIdx, stemI),
        earthlyBranch: b,
        earthlyBranchKr: BRANCHES_KR[branchI],
        earthlyBranchElement: BRANCH_ELEMENTS[b],
        earthlyBranchTenGod: calculateTenGod(dayStemIdx, stemI === dayStemIdx ? -1 : stemI),
        hiddenStems: HIDDEN_STEMS[b] || [],
        twelveState: calculateTwelveState(dayStemIdx, branchI)
      };
    }

    var yearPillar = makePillar(yearStemIdx, yearBranchIdx);
    var monthPillar = makePillar(monthInfo.stemIdx, monthInfo.branchIdx);
    var dayPillar = makePillar(dayStemIdx, dayBranchIdx);
    var hourPillar = (!input.isTimeUnknown && hourStemIdx >= 0)
      ? makePillar(hourStemIdx, hourBranchIdx)
      : null;

    // 오행 집계
    var elements = { wood: 0, fire: 0, earth: 0, metal: 0, water: 0 };
    var allElements = [
      yearPillar.heavenlyStemElement, yearPillar.earthlyBranchElement,
      monthPillar.heavenlyStemElement, monthPillar.earthlyBranchElement,
      dayPillar.heavenlyStemElement, dayPillar.earthlyBranchElement
    ];
    if (hourPillar) {
      allElements.push(hourPillar.heavenlyStemElement, hourPillar.earthlyBranchElement);
    }
    allElements.forEach(function (el) { elements[el] += 1; });

    var totalCount = allElements.length;
    var elementPercentages = {};
    var maxEl = 'wood';
    var maxCount = -1;
    var lacking = [];

    ELEMENT_KEYS.forEach(function (el) {
      elementPercentages[el] = Math.round((elements[el] / totalCount) * 100);
      if (elements[el] > maxCount) {
        maxCount = elements[el];
        maxEl = el;
      }
      if (elements[el] === 0) lacking.push(el);
    });

    // 대운 (양남음녀 순행, 음남양녀 역행)

  // ── AI 서버 연동 (없으면 내장 해설로 자동 대체) ────────────────────────
  function apiBase() {
    var configured = window.MYEONGGYEOL_API_BASE;
    if (typeof configured !== 'string' || !configured) return '';
    return configured.replace(/\/+$/, '');
  }

  function canFetch() {
    return typeof window.fetch === 'function' && typeof window.Promise === 'function';
  }

  // 응답을 못 받아도 절대 예외를 던지지 않고 onDone(null) 로 끝냅니다.
  function postJson(path, payload, timeoutMs, onDone) {
    var base = apiBase();
    if (!base || !canFetch()) { onDone(null); return; }

    var settled = false;
    function finish(value) {
      if (settled) return;
      settled = true;
      onDone(value);
    }

    var controller = null;
    try {
      if (typeof window.AbortController === 'function') controller = new window.AbortController();
    } catch (e) { controller = null; }

    var timer = window.setTimeout(function () {
      if (controller) { try { controller.abort(); } catch (e) {} }
      finish(null);
    }, timeoutMs);

    var options = {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    };
    if (controller) options.signal = controller.signal;

    try {
      window.fetch(base + path, options).then(function (res) {
        if (!res || !res.ok) throw new Error('bad status');
        return res.json();
      }).then(function (data) {
        window.clearTimeout(timer);
        finish(data && typeof data === 'object' ? data : null);
      })['catch'](function () {
        window.clearTimeout(timer);
        finish(null);
      });
    } catch (e) {
      window.clearTimeout(timer);
      finish(null);
    }
  }

  function loadInterpretation(saju) {
    state.loadingAi = true;
    renderAiBody();

    postJson('/api/saju/interpret', { saju: saju }, 20000, function (data) {
      if (state.saju !== saju) return; // 그 사이 다시 입력한 경우
      var ok = data && data.summary && data.luckyElements;
      state.interpretation = ok ? data : localInterpretation(saju);
      state.interpretationSource = ok ? 'ai' : 'local';
      state.loadingAi = false;
      renderAiBody();
      renderLucky();
      updateSubmitButton();
      updateAiModeLabel();
    });
  }

  function sendChat(question) {
    var text = String(question || '').trim();
    if (!text || state.chatLoading || !state.saju) return;

    var saju = state.saju;
    state.chat.push({ sender: 'user', text: text });
    state.chatLoading = true;
    renderChat();

    var history = state.chat.slice();
    postJson('/api/saju/chat', { message: text, saju: saju, history: history }, 20000, function (data) {
      if (state.saju !== saju) return;
      var reply = data && typeof data.reply === 'string' && data.reply.trim()
        ? data.reply.trim()
        : localChatReply(saju, text);
      state.chat.push({ sender: 'ai', text: reply });
      state.chatLoading = false;
      renderChat();
      var input = $('[data-chat-input]');
      if (input) { try { input.focus(); } catch (e) {} }
    });
  }

  function updateAiModeLabel() {
    var label = $('[data-ai-mode]');
    if (!label) return;
    label.textContent = state.interpretationSource === 'ai'
      ? '✔ AI 서버에 연결되어 실시간 풀이 중'
      : '✔ 내장 해설로 동작 중 (AI 서버 연결 시 자동 전환)';
  }

  function updateSubmitButton() {
    var btn = $('[data-submit]');
    var label = $('[data-submit-label]');
    if (!btn || !label) return;
    btn.disabled = state.loadingAi;
    label.textContent = state.loadingAi ? '만세력 계산 및 심층 풀이 진행 중...' : '내 사주 무료로 보기';
  }

  // ── 동작 ──────────────────────────────────────────────────────────────
  function scrollTo(selector) {
    var el = $(selector);
    if (!el) return;
    try {
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (e) {
      try { el.scrollIntoView(); } catch (e2) {}
    }
  }

  /**
   * 고른 연·월에 실제로 있는 날짜만 남기고, 윤달 선택지를 켜고 끕니다.
   * 음력은 달마다 29·30일이 갈리고 윤달도 해마다 드는 달이 달라서,
   * 1~31일을 그대로 두면 없는 날짜를 고를 수 있게 됩니다.
   */
  function refreshDateOptions() {
    var yearEl = $('#mg-year');
    var monthEl = $('#mg-month');
    var dayEl = $('#mg-day');
    if (!yearEl || !monthEl || !dayEl) return;

    var year = Number(yearEl.value);
    var month = Number(monthEl.value);
    var isLunar = state.calendarType === 'lunar';
    var leapMonth = isLunar ? lunarLeapMonth(year) : 0;
    var canPickLeap = leapMonth === month;

    if (state.isLeapMonth && !canPickLeap) state.isLeapMonth = false;

    // 윤달 체크박스
    var wrap = $('[data-leap-wrap]');
    var check = $('[data-leap-check]');
    var label = $('[data-leap-label]');
    if (wrap && check && label) {
      wrap.classList.toggle('mg-hidden', !canPickLeap);
      check.checked = !!state.isLeapMonth;
      if (canPickLeap) {
        label.textContent = year + '년에는 윤' + leapMonth + '월이 있습니다 — 윤달로 태어나셨다면 체크해 주세요.';
      }
    }

    // 음력 지원 범위 안내
    var msg = $('[data-lunar-msg]');
    if (msg) {
      msg.textContent = (isLunar && !lunarYearSupported(year))
        ? '음력 환산은 ' + LUNAR_MIN_YEAR + '~' + LUNAR_MAX_YEAR + '년만 지원합니다. 이 연도는 양력으로 입력해 주세요.'
        : '음력으로 입력하시면 한국천문연구원(KASI) 기준으로 양력으로 환산해 계산합니다.';
    }

    // 그 달에 실제로 있는 날 수
    var count;
    if (isLunar) {
      count = lunarMonthDays(year, month, state.isLeapMonth) || 30;
    } else {
      count = new Date(year, month, 0).getDate();
    }

    var selected = Number(dayEl.value) || 1;
    if (selected > count) selected = count;
    var html = '';
    for (var d = 1; d <= count; d++) {
      html += '<option value="' + d + '"' + (d === selected ? ' selected' : '') + '>' + d + '일<\/option>';
    }
    dayEl.innerHTML = html;
    dayEl.value = String(selected);
  }

  function readForm() {
    function value(sel, fallback) {
      var el = $(sel);
      var n = el ? Number(el.value) : NaN;
      return isNaN(n) ? fallback : n;
    }
    var nameEl = $('#mg-name');
    var regionEl = $('#mg-region');

    return {
      name: (nameEl && nameEl.value ? nameEl.value : '').trim() || '의뢰인',
      gender: state.gender,
      calendarType: state.calendarType,
      isLeapMonth: state.calendarType === 'lunar' && state.isLeapMonth,
      year: value('#mg-year', 1995),
      month: value('#mg-month', 5),
      day: value('#mg-day', 18),
      hour: value('#mg-hour', 14),
      minute: 30,
      isTimeUnknown: state.timeUnknown,
      region: regionEl && regionEl.value ? regionEl.value : REGION_OPTIONS[0]
    };
  }

  function runSaju() {
    var saju;
    try {
      saju = calculateManse(readForm());
    } catch (err) {
      // 계산이 실패해도 아임웹 페이지가 멈추지 않도록 여기서 끊습니다.
      if (window.console && console.error) console.error('[명결] 만세력 계산 오류', err);
      return;
    }

    state.saju = saju;
    state.interpretation = null;
    state.interpretationSource = '';
    state.tab = ({ wealth: 'wealth', career: 'career', match: 'love', luck: 'year' })[state.section] || 'summary';
    state.remedyElement = saju.lackingElement.length ? saju.lackingElement[0] : 'wood';
    state.showAllElements = false;
    state.chat = [{
      sender: 'ai',
      text: '반갑습니다, ' + saju.name + '님. 일간 ‘' + saju.dayMaster + '’의 기운과 원국을 바탕으로 ' +
        '구체적인 시기와 해법을 짚어드리겠습니다. 궁금하신 점을 편하게 질문해 주세요.'
    }];
    state.chatLoading = false;

    var slot = $('[data-result-slot]');
    if (slot) slot.innerHTML = resultHtml(saju);

    renderRemedyBody();
    renderChat();
    loadInterpretation(saju);
    updateSubmitButton();

    window.setTimeout(function () { scrollTo('[data-result-section]'); }, 60);
  }

  function resetSaju() {
    state.saju = null;
    state.interpretation = null;
    state.loadingAi = false;
    var slot = $('[data-result-slot]');
    if (slot) slot.innerHTML = '';
    updateSubmitButton();
    scrollTo('[data-form-card]');
  }

  function setSection(id) {
    state.section = id;
    $all('[data-nav]').forEach(function (btn) {
      if (btn.getAttribute('data-nav') === id) btn.classList.add('mg-on');
      else btn.classList.remove('mg-on');
    });

    var tabByNav = { wealth: 'wealth', career: 'career', match: 'love', luck: 'year', saju: 'summary' };
    if (state.saju && tabByNav[id]) {
      state.tab = tabByNav[id];
      renderAiBody();
    }

    if (id === 'home') scrollTo('[data-form-card]');
    else if (state.saju) scrollTo(id === 'ai-chat' ? '[data-chat-log]' : '[data-result-section]');
    else scrollTo('[data-form-card]');
  }

  function bindEvents() {
    root.addEventListener('click', function (ev) {
      var target = ev.target;
      // Shadow DOM 안에서도 안전하게 조상 요소를 찾습니다.
      function closest(attr) {
        var node = target;
        while (node && node !== root) {
          if (node.nodeType === 1 && node.hasAttribute && node.hasAttribute(attr)) return node;
          node = node.parentNode;
        }
        return null;
      }

      var el;

      if ((el = closest('data-nav'))) { setSection(el.getAttribute('data-nav')); return; }
      if ((el = closest('data-category'))) { setSection(el.getAttribute('data-category')); return; }
      if ((el = closest('data-action'))) {
        var action = el.getAttribute('data-action');
        if (action === 'jump-form') scrollTo('[data-form-card]');
        else if (action === 'reset') resetSaju();
        else if (action === 'go-remedy') scrollTo('[data-remedy-section]');
        return;
      }
      if ((el = closest('data-submit'))) { ev.preventDefault(); runSaju(); return; }
      if ((el = closest('data-tab'))) { state.tab = el.getAttribute('data-tab'); renderAiBody(); return; }
      if ((el = closest('data-remedy'))) { state.remedyElement = el.getAttribute('data-remedy'); renderRemedyBody(); return; }
      if ((el = closest('data-quick'))) { sendChat(el.getAttribute('data-quick')); return; }
      if ((el = closest('data-chat-send'))) {
        ev.preventDefault();
        var input = $('[data-chat-input]');
        if (input) { sendChat(input.value); input.value = ''; }
        return;
      }
      if ((el = closest('data-toggle-guide'))) {
        state.showGuide = !state.showGuide;
        var body = $('[data-guide-body]');
        if (body) body.classList.toggle('mg-hidden', !state.showGuide);
        el.textContent = state.showGuide ? '설명 접기' : '알기 쉬운 기술 설명 보기';
        return;
      }
      if ((el = closest('data-toggle-elements'))) {
        state.showAllElements = !state.showAllElements;
        var box = $('[data-all-elements]');
        if (box) box.classList.toggle('mg-hidden', !state.showAllElements);
        el.textContent = state.showAllElements ? '처방 접기' : '다른 오행 보기';
        return;
      }

      // 토글 버튼 그룹 (성별 / 양력·음력)
      var group = target;
      while (group && group !== root && !(group.nodeType === 1 && group.hasAttribute && group.hasAttribute('data-value'))) {
        group = group.parentNode;
      }
      if (group && group !== root) {
        var wrap = group.parentNode;
        var kind = wrap && wrap.getAttribute ? wrap.getAttribute('data-group') : null;
        if (kind) {
          var value = group.getAttribute('data-value');
          if (kind === 'gender') state.gender = value;
          if (kind === 'calendar') {
            state.calendarType = value;
            var note = $('[data-lunar-note]');
            if (note) note.classList.toggle('mg-hidden', value !== 'lunar');
            refreshDateOptions();
          }
          Array.prototype.forEach.call(wrap.children, function (child) {
            child.classList.toggle('mg-on', child === group);
          });
        }
      }
    });

    root.addEventListener('change', function (ev) {
      var el = ev.target;
      if (!el || !el.hasAttribute) return;

      if (el.hasAttribute('data-time-unknown')) {
        state.timeUnknown = !!el.checked;
        var hour = $('#mg-hour');
        if (hour) hour.disabled = state.timeUnknown;
        return;
      }
      if (el.hasAttribute('data-leap-check')) {
        state.isLeapMonth = !!el.checked;
        refreshDateOptions();
        return;
      }
      if (el.id === 'mg-year' || el.id === 'mg-month') {
        refreshDateOptions();
      }
    });

    // 엔터키 처리 — <form>을 쓰지 않으므로(아임웹 페이지의 폼 안에 들어가도
    // 깨지지 않도록) 키 입력을 직접 받습니다.
    root.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter' && ev.keyCode !== 13) return;
      var el = ev.target;
      if (!el || !el.hasAttribute) return;

      if (el.hasAttribute('data-chat-input')) {
        ev.preventDefault();
        sendChat(el.value);
        el.value = '';
      } else if (el.id === 'mg-name') {
        ev.preventDefault();
        runSaju();
      }
    });
  }

  // ── 웹폰트 (실패해도 기본 글꼴로 정상 표시됩니다) ──────────────────────
  function injectFonts() {
    if (window.MYEONGGYEOL_NO_FONTS) return;
    var fonts = [
      { id: 'mg-font-serif', href: 'https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&display=swap' },
      { id: 'mg-font-sans', href: 'https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css' }
    ];
    try {
      for (var i = 0; i < fonts.length; i++) {
        if (document.getElementById(fonts[i].id)) continue;
        var link = document.createElement('link');
        link.id = fonts[i].id;
        link.rel = 'stylesheet';
        link.href = fonts[i].href;
        (document.head || document.documentElement).appendChild(link);
      }
    } catch (e) { /* 폰트는 없어도 그만입니다 */ }
  }

  // ── 시작 ──────────────────────────────────────────────────────────────
  function resolveContainer() {
    var existing = document.getElementById(CONTAINER_ID);
    if (existing) return existing;

    // 컨테이너 <div>가 없으면 이 <script> 자리에 직접 만듭니다.
    var parent = thisScript && thisScript.parentNode;
    if (!parent) return null;
    var created = document.createElement('div');
    created.id = CONTAINER_ID;
    parent.insertBefore(created, thisScript);
    return created;
  }

  function mount() {
    var container;
    try {
      container = resolveContainer();
    } catch (e) {
      container = null;
    }
    if (!container || container.getAttribute(MOUNT_FLAG) === 'true') return;
    container.setAttribute(MOUNT_FLAG, 'true');

    // Shadow DOM 이면 아임웹 테마 CSS가 위젯 안으로 들어오지도,
    // 위젯 CSS가 아임웹 페이지로 새어 나가지도 않습니다.
    var rootSelector = '#' + CONTAINER_ID;
    root = container;
    if (typeof container.attachShadow === 'function') {
      try {
        root = container.attachShadow({ mode: 'open' });
        rootSelector = ':host';
      } catch (e) {
        root = container;
        rootSelector = '#' + CONTAINER_ID;
      }
    }

    var css = CSS_TEMPLATE.join('\n').replace(/__ROOT__/g, rootSelector);
    var style = document.createElement('style');
    style.setAttribute('data-myeonggyeol-style', 'true');
    style.appendChild(document.createTextNode(css));

    if (root === container) {
      // 폴백: 그림자 DOM이 없는 환경. 스타일은 문서에 넣되 선택자가
      // 모두 #myeonggyeol-widget 안으로 한정되어 있어 페이지에 영향이 없습니다.
      if (!document.querySelector('style[data-myeonggyeol-style]')) {
        (document.head || document.documentElement).appendChild(style);
      }
      container.innerHTML = shellHtml();
    } else {
      root.appendChild(style);
      var holder = document.createElement('div');
      holder.innerHTML = shellHtml();
      while (holder.firstChild) root.appendChild(holder.firstChild);
    }

    injectFonts();
    bindEvents();

    var heroPhoto = $('[data-hero-photo]');
    if (heroPhoto) {
      heroPhoto.addEventListener('error', function () {
        // 사진을 못 불러오면 감춰서 바탕의 SVG 배경이 드러나게 합니다.
        heroPhoto.style.display = 'none';
      }, false);
    }
    setSection('home');
    refreshDateOptions();
    updateSubmitButton();
  }

  function start() {
    try {
      mount();
    } catch (err) {
      // 위젯이 실패하더라도 아임웹 페이지 전체가 멈추지 않도록 가둡니다.
      if (window.console && console.error) console.error('[명결] 위젯 초기화 실패', err);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start, false);
  } else {
    start();
  }
})();
</script>
